          | Environment | Live URL | Platform | Status |
          |:---|:---|:---:|:---:|
          | **Production Website** | [https://thanujaradhakrishnan04.github.io/Trace/](https://thanujaradhakrishnan04.github.io/Trace/) | GitHub Pages | 🟢 **ACTIVE / LIVE** |
