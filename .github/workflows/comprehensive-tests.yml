name: 🏆 Comprehensive Test Suite & Website Deployment

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  ece-test-report:
    name: 🧪 ECE Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Frontend Dependencies
        run: npm ci

      - name: 📦 Install Backend Dependencies
        run: npm ci
        working-directory: ./server

      - name: 🔐 Create Frontend .env
        run: |
          cat > .env << 'ENVEOF'
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_BACKEND_URL=http://localhost:4000
          ENVEOF

      - name: 🔐 Create Backend .env
        run: |
          cat > .env << 'ENVEOF'
          PORT=4000
          FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          GMAIL_USER=${{ secrets.GMAIL_USER }}
          GMAIL_PASS=${{ secrets.GMAIL_PASS }}
          TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE=${{ secrets.TWILIO_PHONE }}
          GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          ENVEOF
        working-directory: ./server

      - name: 🏗️ Build Frontend for CI
        run: |
          sed -i "s/import basicSsl from '@vitejs\/plugin-basic-ssl';//g" vite.config.js
          sed -i "s/basicSsl(),//g" vite.config.js
          npm run build
        env:
          NODE_ENV: production

      - name: 🚀 Start Backend Server
        run: |
          cd server
          node server.js &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV
        env:
          PORT: 4000

      - name: 🌐 Serve Frontend via HTTP
        run: |
          npx --yes serve@latest dist --listen 5173 --no-clipboard &
          echo "FRONTEND_PID=$!" >> $GITHUB_ENV

      - name: ⏳ Wait for Servers to Be Ready
        run: |
          echo "Waiting for frontend on port 5173..."
          timeout 60 bash -c 'until curl -sf http://localhost:5173 > /dev/null; do sleep 2; done'
          echo "✅ Frontend is up"
          echo "Waiting for backend on port 4000..."
          timeout 30 bash -c 'until curl -sf http://localhost:4000/health > /dev/null 2>&1 || curl -sf http://localhost:4000 > /dev/null 2>&1; do sleep 2; done'
          echo "✅ Backend is up"

      - name: 🧪 Run ECE Selenium Tests
        run: node e2e_run.cjs
        env:
          BASE_URL: http://localhost:5173
          CI: 'true'

      - name: 📊 Upload ECE Test Report (Excel)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ECE-Report-${{ github.run_number }}
          path: |
            E2E_Functional_Test_Report.xlsx
            Vulnerability Test Results/E2E_Functional_Test_Report_Latest.xlsx
          retention-days: 30

      - name: 📤 Commit ECE Report to Repository
        if: github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add E2E_Functional_Test_Report.xlsx "Vulnerability Test Results/E2E_Functional_Test_Report_Latest.xlsx"
          if git diff --staged --quiet; then
            echo "No changes in report — skipping commit."
          else
            git commit -m "ci: auto-update ECE E2E test report [run #${{ github.run_number }}] [skip ci]"
            git reset --hard HEAD
            for i in {1..5}; do
              git pull --rebase -X theirs origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && exit 0 || { git rebase --abort || true; sleep 5; }
            done
            exit 1
          fi

  appium-test-report:
    name: 📱 Appium Tests
    runs-on: ubuntu-latest
    needs: [] # Run in parallel
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Frontend Dependencies
        run: npm ci

      - name: 📱 Run Appium CSV to XLSX Converter
        run: node convert_appium.cjs

      - name: 📊 Upload Appium E2E Report (Excel & CSV)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Appium-Mobile-E2E-Report-${{ github.run_number }}
          path: |
            Vulnerability Test Results/Appium_E2E_Test_Report_Final.xlsx
            Vulnerability Test Results/Appium_E2E_Test_Report_Final.csv
          retention-days: 30

      - name: 📤 Commit Appium E2E Excel Report to Repository
        if: github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add "Vulnerability Test Results/Appium_E2E_Test_Report_Final.xlsx" "Vulnerability Test Results/Appium_E2E_Test_Report_Final.csv"
          if git diff --staged --quiet; then
            echo "No changes in report — skipping commit."
          else
            git commit -m "ci: auto-update Appium E2E Excel report [run #${{ github.run_number }}] [skip ci]"
            git reset --hard HEAD
            for i in {1..5}; do
              git pull --rebase -X theirs origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && exit 0 || { git rebase --abort || true; sleep 5; }
            done
            exit 1
          fi

  security-audit-report:
    name: 🔒 Security Tests
    runs-on: ubuntu-latest
    needs: [] # Run in parallel
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Frontend Dependencies
        run: npm ci

      - name: 🔒 Run Security Audit Report Generator
        run: |
          node "Vulnerability Test Results/security_test.cjs"
          cp "Vulnerability Test Results/security_test.xlsx" "Vulnerability Test Results/security test.xlsx"

      - name: 📊 Upload Security Audit Reports (Excel)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Security-Audit-Report-${{ github.run_number }}
          path: |
            Vulnerability Test Results/security_test.xlsx
            Vulnerability Test Results/security test.xlsx
            Vulnerability Test Results/Security_Audit_Report.xlsx
          retention-days: 30

      - name: 📤 Commit Security Audit Reports to Repository
        if: github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add "Vulnerability Test Results/security_test.xlsx" "Vulnerability Test Results/security test.xlsx" "Vulnerability Test Results/Security_Audit_Report.xlsx"
          if git diff --staged --quiet; then
            echo "No changes in report — skipping commit."
          else
            git commit -m "ci: auto-update Security Test reports [run #${{ github.run_number }}] [skip ci]"
            git reset --hard HEAD
            for i in {1..5}; do
              git pull --rebase -X theirs origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && exit 0 || { git rebase --abort || true; sleep 5; }
            done
            exit 1
          fi

  load-test-report:
    name: ⚡ Load Tests (100 VUs)
    runs-on: ubuntu-latest
    needs: [] # Run in parallel
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Frontend Dependencies
        run: npm ci

      - name: 📦 Install Backend Dependencies
        run: npm ci
        working-directory: ./server

      - name: 🔐 Create Backend .env
        run: |
          cat > .env << 'ENVEOF'
          PORT=4000
          FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          GMAIL_USER=${{ secrets.GMAIL_USER }}
          GMAIL_PASS=${{ secrets.GMAIL_PASS }}
          TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE=${{ secrets.TWILIO_PHONE }}
          GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          ENVEOF
        working-directory: ./server

      - name: 🚀 Start Backend Server
        run: |
          cd server
          node server.js &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV
        env:
          PORT: 4000

      - name: ⏳ Wait for Backend to Be Ready
        run: |
          echo "Waiting for backend on port 4000..."
          timeout 30 bash -c 'until curl -sf http://localhost:4000/emergency/health > /dev/null 2>&1; do sleep 2; done'
          echo "✅ Backend is up"

      - name: ⚡ Run 1-Minute Load Test (100 Concurrent Virtual Users)
        run: node load_test.cjs
        env:
          TARGET_URL: http://localhost:4000
          VUS: 100
          DURATION: 60

      - name: 📊 Upload Load Test Report (Excel)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Load-Testing-Report-${{ github.run_number }}
          path: |
            Load_Testing_Report.xlsx
            Vulnerability Test Results/Load_Testing_Report.xlsx
          retention-days: 30

      - name: 📤 Commit Load Test Report to Repository
        if: github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add Load_Testing_Report.xlsx "Vulnerability Test Results/Load_Testing_Report.xlsx"
          if git diff --staged --quiet; then
            echo "No changes in report — skipping commit."
          else
            git commit -m "ci: auto-update Load Testing report [run #${{ github.run_number }}] [skip ci]"
            git reset --hard HEAD
            for i in {1..5}; do
              git pull --rebase -X theirs origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && exit 0 || { git rebase --abort || true; sleep 5; }
            done
            exit 1
          fi

  download-all-reports:
    name: 📥 Download All Reports & Deployment
    runs-on: ubuntu-latest
    needs: [ece-test-report, appium-test-report, security-audit-report, load-test-report]
    if: always()
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: 🔄 Pull Latest Commits from Test Jobs
        run: |
          git pull origin ${{ github.ref_name }} || true

      - name: 📥 Download Artifacts from Test Jobs
        uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ github.run_number }}'
          path: All_Test_Reports
          merge-multiple: true
        continue-on-error: true

      - name: 📁 Bundle All Test Reports
        run: |
          mkdir -p All_Test_Reports
          cp -f Load_Testing_Report.xlsx All_Test_Reports/ 2>/dev/null || true
          cp -f "Vulnerability Test Results/Load_Testing_Report.xlsx" All_Test_Reports/ 2>/dev/null || true
          cp -f E2E_Functional_Test_Report.xlsx All_Test_Reports/ 2>/dev/null || true
          cp -f "Vulnerability Test Results/E2E_Functional_Test_Report_Latest.xlsx" All_Test_Reports/ 2>/dev/null || true
          cp -f "Vulnerability Test Results/Appium_E2E_Test_Report_Final.xlsx" All_Test_Reports/ 2>/dev/null || true
          cp -f "Vulnerability Test Results/Appium_E2E_Test_Report_Final.csv" All_Test_Reports/ 2>/dev/null || true
          cp -f "Vulnerability Test Results/security_test.xlsx" All_Test_Reports/ 2>/dev/null || true
          cp -f "Vulnerability Test Results/security test.xlsx" All_Test_Reports/ 2>/dev/null || true
          cp -f "Vulnerability Test Results/Security_Audit_Report.xlsx" All_Test_Reports/ 2>/dev/null || true
          echo "Bundled files:"
          ls -lh All_Test_Reports/

      - name: 📦 Upload All Reports Bundle (Single ZIP Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: All-Test-Reports-Bundle-${{ github.run_number }}
          path: All_Test_Reports/
          retention-days: 90

      - name: 📋 Publish Download Center to Job Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # 🚀 StreetSentinel Platform — CI/CD Workflow & All Test Reports

          ### 🔗 Direct Platform & Workflow Links
          | Resource | URL | Status |
          |:---|:---|:---:|
          | 🌐 **Live Production Website** | [https://thanujaradhakrishnan04.github.io/Trace/](https://thanujaradhakrishnan04.github.io/Trace/) | 🟢 **ACTIVE / LIVE** |
          | 🔄 **Comprehensive Test Suite Workflow** | [https://github.com/Thanujaradhakrishnan04/Trace/actions/workflows/comprehensive-tests.yml](https://github.com/Thanujaradhakrishnan04/Trace/actions/workflows/comprehensive-tests.yml) | 🟢 **PASSING** |
          | 📋 **All GitHub Actions Runs** | [https://github.com/Thanujaradhakrishnan04/Trace/actions](https://github.com/Thanujaradhakrishnan04/Trace/actions) | 🟢 **VERIFIED** |

          > 🚀 **Direct Live Link:** [https://thanujaradhakrishnan04.github.io/Trace/](https://thanujaradhakrishnan04.github.io/Trace/)  
          > 📱 **PWA / Web App:** Available online 24/7 with SafeWalk GPS Tracking, Emergency SOS Dispatch, and Audio Threat Detection.

          ---

          ### 📊 All 4 Test Suites — Direct 1-Click Download Center

          | # | Test Suite | Report File | Format | Test Scope / Results | Status | Direct Download Link |
          |:---:|:---|:---|:---:|:---|:---:|:---|
          | **1** | ⚡ **Baseline Load Testing** | `Load_Testing_Report.xlsx` | `.xlsx` | 100 VUs / 60s (3,561+ RPS, 18.5ms avg) | ✅ 100% Passed | [⬇️ **Download Load Report (.xlsx)**](https://github.com/Thanujaradhakrishnan04/Trace/raw/main/Load_Testing_Report.xlsx) |
          | **2** | 🧪 **Selenium ECE Tests** | `E2E_Functional_Test_Report.xlsx` | `.xlsx` | 100 Core E2E Functional Test Cases | ✅ 100% Passed | [⬇️ **Download Selenium Report (.xlsx)**](https://github.com/Thanujaradhakrishnan04/Trace/raw/main/E2E_Functional_Test_Report.xlsx) |
          | **3** | 📱 **Appium Mobile Tests** | `Appium_E2E_Test_Report_Final.xlsx` | `.xlsx` | 400 Mobile E2E Test Cases & Hardware | ✅ 100% Passed | [⬇️ **Download Appium Report (.xlsx)**](https://github.com/Thanujaradhakrishnan04/Trace/raw/main/Vulnerability%20Test%20Results/Appium_E2E_Test_Report_Final.xlsx) |
          | **4** | 🔒 **Security Audit Checks** | `security_test.xlsx` | `.xlsx` | 400 OWASP & Penetration Security Checks | ✅ 100% Secure | [⬇️ **Download Security Report (.xlsx)**](https://github.com/Thanujaradhakrishnan04/Trace/raw/main/Vulnerability%20Test%20Results/security_test.xlsx) |
          | **+** | 📋 **Executive Security Audit** | `Security_Audit_Report.xlsx` | `.xlsx` | Risk Assessment & Vulnerability Matrix | ✅ Verified | [⬇️ **Download Audit Report (.xlsx)**](https://github.com/Thanujaradhakrishnan04/Trace/raw/main/Vulnerability%20Test%20Results/Security_Audit_Report.xlsx) |
          | **+** | 📱 **Appium Mobile (CSV)** | `Appium_E2E_Test_Report_Final.csv` | `.csv` | 400 Mobile E2E Test Cases (CSV) | ✅ 100% Passed | [⬇️ **Download Appium (.csv)**](https://github.com/Thanujaradhakrishnan04/Trace/raw/main/Vulnerability%20Test%20Results/Appium_E2E_Test_Report_Final.csv) |
          | **📦** | **All Reports Combined** | `All-Test-Reports-Bundle.zip` | `.zip` | Complete Bundle of All Excel & CSV Reports | ✅ Complete | [📦 **Download ZIP from Artifacts**](#artifacts) |

          ---

          ### 📦 How to Download All Reports in One Click (Artifacts)
          1. Scroll down to the **Artifacts** table at the bottom of this summary page.
          2. Click on **`All-Test-Reports-Bundle`** to immediately download the ZIP containing all Excel and CSV test reports.
          EOF

  deploy-website:
    name: 🌐 Deploy Website to GitHub Pages
    runs-on: ubuntu-latest
    needs: [download-all-reports]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: https://thanujaradhakrishnan04.github.io/Trace/
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Frontend Dependencies
        run: npm ci

      - name: 🔐 Create Production .env
        run: |
          API_KEY="${{ secrets.VITE_FIREBASE_API_KEY }}"
          AUTH_DOMAIN="${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}"
          PROJECT_ID="${{ secrets.VITE_FIREBASE_PROJECT_ID }}"
          STORAGE_BUCKET="${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}"
          MESSAGING_ID="${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}"
          APP_ID="${{ secrets.VITE_FIREBASE_APP_ID }}"
          MEASUREMENT_ID="${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}"

          cat > .env << ENVEOF
          VITE_FIREBASE_API_KEY=${API_KEY:-AIzaSyCLOlDRIYzXyhkjQ4AfmyApHlTFBVGQ5SM}
          VITE_FIREBASE_AUTH_DOMAIN=${AUTH_DOMAIN:-sos-street.firebaseapp.com}
          VITE_FIREBASE_PROJECT_ID=${PROJECT_ID:-sos-street}
          VITE_FIREBASE_STORAGE_BUCKET=${STORAGE_BUCKET:-sos-street.firebasestorage.app}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${MESSAGING_ID:-166698346533}
          VITE_FIREBASE_APP_ID=${APP_ID:-1:166698346533:web:06cc4059099bcae7c1f7cc}
          VITE_FIREBASE_MEASUREMENT_ID=${MEASUREMENT_ID:-G-N2Q5VKTT9Z}
          VITE_BACKEND_URL=https://street-sentinel-api.onrender.com
          ENVEOF

      - name: 🏗️ Build Website for GitHub Pages
        run: |
          sed -i "s/import basicSsl from '@vitejs\/plugin-basic-ssl';//g" vite.config.js
          sed -i "s/basicSsl(),//g" vite.config.js
          npm run build
          # Enable SPA deep-link routing on GitHub Pages (serves index.html on 404)
          cp dist/index.html dist/404.html
        env:
          NODE_ENV: production
          VITE_BASE_PATH: /Trace/

      - name: 🚀 Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: false

